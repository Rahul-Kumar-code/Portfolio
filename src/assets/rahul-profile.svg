<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#58FFE2" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#4B7BFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B1229" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="innerRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58FFE2"/>
      <stop offset="50%" stop-color="#6E7BFF"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset in="blur" dx="0" dy="18" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.26 0 0 0 0 0.52 0 0 0 0 1 0 0 0 0.35 0"/>
      <feBlend in="SourceGraphic" in2="offset" mode="normal"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="256" fill="#030712"/>
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="190" fill="url(#outerGlow)"/>
  </g>
  <circle cx="256" cy="256" r="150" fill="#040B1B" stroke="url(#innerRing)" stroke-width="18" opacity="0.95"/>
  <text x="50%" y="52%" text-anchor="middle" fill="#58FFE2" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="160" font-weight="700" letter-spacing="0.1em">RK</text>
  <text x="50%" y="64%" text-anchor="middle" fill="#9CA3AF" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="28" font-weight="500" letter-spacing="0.4em">2025</text>
</svg>
